name: gimforze
publish_to: 'none'
version: 2.0.13+13
description: Gimforze - entrenamiento inteligente, progreso y gamificacion.
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gimforze_logo.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "gimforze_logo.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
