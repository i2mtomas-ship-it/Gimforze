name: Build Gimforze iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar Flutter
        run: flutter --version

      - name: Crear plataforma iOS
        run: flutter create --platforms ios .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar icono iOS
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Comprobar estructura iOS
        run: |
          echo "=== IOS ==="
          find ios -maxdepth 4 -type f | head -100
          echo "=== APP ICONS ==="
          find ios/Runner/Assets.xcassets/AppIcon.appiconset -maxdepth 1 -type f -print || true

      - name: Compilar aplicación iOS sin firma
        run: flutter build ios --release --no-codesign

      - name: Comprobar aplicación generada
        run: |
          echo "=== BUILD IOS ==="
          find build/ios -maxdepth 5 -type f -print || true
          echo "=== RUNNER APP ==="
          ls -lah build/ios/iphoneos/Runner.app || true

      - name: Crear IPA sin firma
        run: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: No se encontró $APP"
            exit 1
          fi
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/Runner.app
          mkdir -p build/ios/ipa
          cd /tmp
          rm -f "$GITHUB_WORKSPACE/build/ios/ipa/Gimforze.ipa"
          zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/Gimforze.ipa" Payload
          echo "=== IPA CREADA ==="
          ls -lh "$GITHUB_WORKSPACE/build/ios/ipa/Gimforze.ipa"

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gimforze-IPA
          path: build/ios/ipa/Gimforze.ipa
          if-no-files-found: error
          retention-days: 7
