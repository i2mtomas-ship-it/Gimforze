name: Build Gimforze iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar Flutter
        run: flutter --version

      - name: Crear plataforma iOS
        run: flutter create --platforms ios .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar icono iOS
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Analizar cÃ³digo de la app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Generar IPA sin firma
        run: flutter build ipa --release --no-codesign

      - name: Comprobar archivos generados`r`n        run: |`r`n          echo "=== BUILD IOS ===`r`n find build/ios -maxdepth 4 -type f -print || true`r`n echo === ARCHIVOS IPA ===`r`n find . -name *.ipa -print || true`r`n`r`n - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gimforze-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7



